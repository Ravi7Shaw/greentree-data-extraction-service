services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hubspot_deals_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d hubspot_deals_data"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8123/ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  service:
    build: .
    environment:

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hubspot_deals_data
      DB_USER: postgres
      DB_PASSWORD: password123
      PORT: 5200

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: hubspot
      MINIO_REGION: us-east-1

      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD:
      CLICKHOUSE_DATABASE: analytics

      HUBSPOT_API_BASE_URL: ${HUBSPOT_API_BASE_URL:-https://api.hubapi.com}

    ports:
      - "5200:5200"

    depends_on:
      postgres:
        condition: service_healthy

      minio:
        condition: service_healthy

      clickhouse:
        condition: service_healthy


volumes:
  postgres_data:
  minio_data:
  clickhouse_data:
